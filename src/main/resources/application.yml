spring:
  application:
    name: "easy-workout"
  output:
    ansi:
      enabled: ALWAYS
  h2:
    console:
      enabled: true
      path: "/h2-console"
  datasource:
    url: "jdbc:h2:mem:easyworkout"
    driver-class-name: "org.h2.Driver"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: ALWAYS

server:
  servlet:
    context-path: "/easy-workout/v1"

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

